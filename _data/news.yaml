- date: 2025-12-01
  text: "Congratulations to Vicky and Clover, who were selected for NYU's [Center for Neural Science Summer Undergraduate Research Program](https://as.nyu.edu/departments/cns/UndergraduateProgram/summer-research-program.html?challenge=d06e90d7-4d8f-4b88-9d8c-10b73beb60f1), a highly competitive 10-week research experience designed to introduce undergraduates to neuroscience research and mentorship."

- date: 2025-11-24
  text: Congratulations to Vicky, who has just received NYU's Dean's Undergraduate Research Award for her work on Predictive Processing of Lexical Tone in Speech Comprehension and Memory-Based Encoding of Linguistic Auditory Information.

